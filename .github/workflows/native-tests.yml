name: Native app checks
on:
  push:
    branches: ['native/html-js']
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python native/export.py
      - run: git diff --exit-code -- native/content.js native/original.css native/tests
      - run: node --check native/app.js && node --check native/engine.js && node --check native/shared.js
      - run: node --test native/tests/*.test.mjs
      - run: python native/build.py
